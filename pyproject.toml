[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lcm"
version = "0.1.0"
description = "Research artifact for fact-externalized language agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "tokenizers>=0.13.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
include = ["agent*", "eval*", "synth*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

