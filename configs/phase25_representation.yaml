  source_exposure_key: "R89"
  probe_variants: [4, 8]
  screen_variants: 4
  screen_exposure: 88.888889
  seeds: [17, 29, 41, 53, 67]
  contrast_replacement_fraction: 0.25
  contrast_seed: 17
  train_pairs:
    - [11, 7]
    - [13, 8]
