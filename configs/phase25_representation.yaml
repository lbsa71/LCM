tokenizer:
  mode: "fixed_byte"
  vocab_size: 512
  min_frequency: 1

model:
  hidden_size: 96
  num_hidden_layers: 3
  num_attention_heads: 4
  intermediate_size: 384
  # Longest registered typed train/development sequence is 110 tokens.
  max_position_embeddings: 128
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true

training:
  learning_rate: 1.0e-3
  min_learning_rate: 1.0e-4
  weight_decay: 0.01
  batch_size: 16
  gradient_accumulation_steps: 1
  # The runner derives 800 steps and 80 warmup steps from screen_exposure.
  max_steps: 800
  warmup_steps: 80
  device: "auto"

evaluation:
  batch_size: 64
