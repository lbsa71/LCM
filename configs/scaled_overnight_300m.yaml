name: "scaled_overnight_300m"
seed: 42

corpus:
  train_worlds: 4000
  val_worlds: 200
  test_worlds: 200
  docs_per_world: 25
  facts_per_world: 40
  distractor_docs_per_world: 10
  task_types_per_world: 8
  counterfactual_pairs_per_world: 8
  trajectory_samples_per_world: 10

tokenizer:
  vocab_size: 8192
  min_frequency: 2
  single_digits: true
  special_tokens:
    - "<PAD>"
    - "<BOS>"
    - "<EOS>"
    - "<UNK>"
    - "<USER>"
    - "<ASSISTANT>"
    - "<TOOL>"
    - "<OBSERVATION>"
    - "<PLAN>"
    - "<ACTION>"
    - "<FINAL>"
    - "SEARCH"
    - "READ"
    - "FILTER"
    - "DOCSLICE"
    - "MATH"
    - "EMIT"
    - "ABSTAIN"
    - "OBS"
    - "LINES"
    - "LIMIT"
    - "EVIDENCE"
    - "REASON"

model:
  vocab_size: 8192
  hidden_size: 1024
  num_hidden_layers: 18
  num_attention_heads: 16
  intermediate_size: 4096
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_word_embeddings: true

pretrain:
  learning_rate: 4.0e-4
  min_learning_rate: 4.0e-5
  weight_decay: 0.01
  batch_size: 4
  gradient_accumulation_steps: 12
  max_steps: 6000
  warmup_steps: 400
  eval_interval: 200
  save_milestones: [1500, 3000, 4500, 6000]
  device: "auto"

agent_sft:
  learning_rate: 2.0e-4
  min_learning_rate: 2.0e-5
  weight_decay: 0.01
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 3500
  warmup_steps: 200
  eval_interval: 200
  save_milestones: [500, 1500, 2500, 3500]
  device: "auto"

agent_runtime:
  max_turns: 12
  max_search_calls: 6
  max_read_calls: 8
  max_exec_calls: 4
  max_tokens_per_turn: 256
  temperature: 0.0
  greedy: true

eval:
  suites:
    - "suite_a_language"
    - "suite_b_invariants"
    - "suite_c_single_hop"
    - "suite_d_multi_hop"
    - "suite_e_retrieval_computation"
    - "suite_f_missing_evidence"
    - "suite_g_tool_recovery"
    - "suite_h_direct_computation"
    - "suite_i_counterfactual_inversion"
    - "anti_memorization_evidence_disabled"
    - "anti_memorization_closed_book"
  run_baselines:
    - "oracle"
    - "no_tool"
